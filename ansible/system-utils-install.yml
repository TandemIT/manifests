---
- name: Install System Utilities on all nodes
  hosts: all
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install QEMU guest agent
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present

    - name: Start and enable QEMU guest agent service
      ansible.builtin.systemd:
        name: qemu-guest-agent
        state: started
        enabled: true

    - name: Install micro editor
      ansible.builtin.apt:
        name: micro
        state: present

    # Reboots are kured's job, not unattended-upgrades' (see 50unattended-upgrades.j2).
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          # Owns the /var/run/reboot-required sentinel that Kured watches.
          - update-notifier-common
        state: present

    - name: Enable the apt-daily/apt-daily-upgrade schedule
      ansible.builtin.template:
        src: 20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'

    - name: Configure unattended-upgrades (origins + no self-reboot)
      ansible.builtin.template:
        src: 50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: '0644'

    - name: Ensure apt-daily timers are enabled and running
      ansible.builtin.systemd:
        name: '{{ item }}'
        enabled: true
        state: started
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer

    # public_mac comes from the inventory (terraform public_vlan_tag > 0).
    - name: Configure the public-VLAN NIC (up, no address)
      ansible.builtin.template:
        src: 60-public0.yaml.j2
        dest: /etc/netplan/60-public0.yaml
        owner: root
        group: root
        mode: '0600'
      register: public_nic
      when: public_mac is defined
      tags: [public-nic]

    - name: Apply netplan (renames the NIC to public0 and brings it up)
      ansible.builtin.command: netplan apply
      when: public_nic is changed
      tags: [public-nic]

    - name: Check public0 is up with no addresses
      ansible.builtin.command: ip -o addr show dev public0
      register: public0_addrs
      changed_when: false
      failed_when: >-
        public0_addrs.rc != 0 or public0_addrs.stdout | length > 0
      when: public_mac is defined
      tags: [public-nic]

    - name: Display system utilities status
      ansible.builtin.debug:
        msg: 'System utilities installed: QEMU guest agent, micro editor, and unattended-upgrades'
