# Lets the garage-bootstrap Job (garage namespace) create its two Secrets in
# this namespace. Lives in this app because the Role must be in gitea.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: garage-bootstrap-write
  namespace: gitea
  labels:
    app.kubernetes.io/name: garage-bootstrap
rules:
  # create cannot be restricted by resourceName
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["garage-gitea-storage-credentials", "garage-backups-credentials"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: garage-bootstrap-write
  namespace: gitea
  labels:
    app.kubernetes.io/name: garage-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: garage-bootstrap-write
subjects:
  - kind: ServiceAccount
    name: garage-bootstrap
    namespace: garage
