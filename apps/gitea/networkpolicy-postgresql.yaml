---
# Gitea and the backup-postgresql CronJob. (The chart's own
# gitea-postgresql-ha-pgpool policy also admits 5432 from anywhere today.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-pgpool-allow
  namespace: gitea
  labels:
    app.kubernetes.io/name: postgresql-ha
    app.kubernetes.io/part-of: source-control
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pgpool
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: backup-postgresql
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# repmgr replication between PostgreSQL pods, plus queries from pgpool.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-postgresql-ha-internal
  namespace: gitea
  labels:
    app.kubernetes.io/name: postgresql-ha
    app.kubernetes.io/part-of: source-control
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgresql
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgpool
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
