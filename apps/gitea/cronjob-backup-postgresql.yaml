# pg_dump through pgpool as the app user (chart defaults gitea/gitea).
# --no-owner, so a dump restores under a new cluster's credentials.
# Replication protects against node loss; this protects against bad
# migrations and deletions, which replicate too.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-postgresql
  namespace: gitea
  labels:
    app.kubernetes.io/name: backup-postgresql
    app.kubernetes.io/part-of: source-control
spec:
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-postgresql
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Official image (maintained, unlike bitnamilegacy); major
            # version must match the server (postgresql-repmgr 17.6.0).
            - name: dump
              image: postgres:17.11
              env:
                - name: PGHOST
                  value: gitea-postgresql-ha-pgpool.gitea.svc.cluster.local
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: gitea
                - name: PGDATABASE
                  value: gitea
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-ha-credentials
                      key: password
              command:
                - /bin/bash
                - -ec
                - |
                  pg_dump --no-owner --format=plain | gzip -9 > "/backup/gitea-$(date +%Y%m%dT%H%M%SZ).sql.gz"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.62
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: garage-backups-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: garage-backups-credentials
                      key: secret-access-key
                - name: AWS_ENDPOINT_URL_S3
                  value: "http://garage.garage.svc.cluster.local:3900"
                - name: AWS_REGION
                  value: "garage"
              command:
                - /bin/bash
                - -ec
                - |
                  for f in /backup/*.sql.gz; do
                    aws s3 cp "${f}" "s3://platform-backups/postgresql/$(basename "${f}")"
                  done
                  cutoff=$(date -d '-14 days' +%Y%m%dT%H%M%SZ)
                  aws s3 ls s3://platform-backups/postgresql/ | awk '{print $4}' | while read -r key; do
                    stamp=$(echo "${key}" | sed -E 's/gitea-([0-9TZ]+)\.sql\.gz/\1/')
                    if [ -n "${stamp}" ] && [ "${stamp}" \< "${cutoff}" ]; then
                      aws s3 rm "s3://platform-backups/postgresql/${key}"
                    fi
                  done
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
          volumes:
            - name: backup
              emptyDir: {}
