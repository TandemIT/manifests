apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-valkey-allow
  namespace: gitea
  labels:
    app.kubernetes.io/name: valkey-cluster
    app.kubernetes.io/part-of: source-control
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: valkey-cluster
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitea
      ports:
        - protocol: TCP
          port: 6379
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey-cluster
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379 # cluster bus: gossip, failover, slot coordination
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey-cluster
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 16379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
