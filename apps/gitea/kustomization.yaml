apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# An explicit list keeps Argo CD from applying the Helm values files in this
# directory as manifests. The chart itself is argocd/apps/gitea.yaml.
resources:
  - namespace.yaml
  - rbac-runner-bootstrap.yaml
  - rbac-garage-bootstrap.yaml
  - middleware.yaml
  - ingressroute-tcp.yaml
  - networkpolicy.yaml
  - networkpolicy-valkey.yaml
  - networkpolicy-postgresql.yaml
  - networkpolicy-garage.yaml
  - cronjob-backup-postgresql.yaml
  - cronjob-backup-gitea-data.yaml
  - cronjob-backup-garage-storage.yaml
