replicaCount: 1

# The chart default (RollingUpdate, maxSurge 100%) runs the old and new pod
# side by side, so an upgrade's DB migration races the old pod's writes.
strategy:
  type: Recreate

deployment:
  # First install waits for PostgreSQL HA and Valkey; the 600 s default
  # expires before pgpool is ready.
  progressDeadlineSeconds: 1800

image:
  registry: ""
  repository: gitea/gitea
  # Chart 12.7.0 ships 1.27.0; pinned separately (no chart release ships 28
  # yet). Chart 12.7.0's init scripts and CLI flags work with 28.0.0.
  tag: "28.0.0"
  pullPolicy: IfNotPresent
  rootless: true

serviceAccount:
  create: true
  automountServiceAccountToken: false

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

persistence:
  enabled: true
  size: 10Gi
  accessModes:
    - ReadWriteOnce

# Routing lives in apps/anubis/ingressroute.yaml.
ingress:
  enabled: false

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 2222
    targetPort: 2222
    protocol: TCP

valkey-cluster:
  enabled: true
  cluster:
    nodes: 6 # 3 primaries + 3 replicas
    replicas: 1 # per primary, for failover
  # Must be nested under valkey:; a top-level podAntiAffinityPreset is
  # ignored and the chart falls back to soft anti-affinity.
  # https://github.com/bitnami/charts/blob/valkey-cluster/3.0.24/bitnami/valkey-cluster/values.yaml
  valkey:
    podAntiAffinityPreset: hard

valkey:
  enabled: false

postgresql:
  enabled: false

postgresql-ha:
  enabled: true

  # existingSecret instead of the chart's published default passwords. Both
  # Secrets come from scripts/01 (key names match what the chart expects).
  global:
    postgresql:
      existingSecret: postgresql-ha-credentials
    pgpool:
      existingSecret: postgresql-ha-pgpool-credentials

  postgresql:
    replicaCount: 2
    repmgrConnectTimeout: 5
    repmgrReconnectAttempts: 2
    repmgrReconnectInterval: 3
    persistence:
      enabled: true
      size: 10Gi

  pgpool:
    replicaCount: 2
    numInitChildren: 8
    maxPool: 2
    persistence:
      enabled: false

  persistence:
    enabled: true
    size: 10Gi

gitea:
  admin:
    existingSecret: gitea-admin

  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

  config:
    server:
      # Gitea 28 derives the domain from ROOT_URL; DOMAIN is only set so the
      # chart doesn't fill in a placeholder of its own.
      DOMAIN: git.open-ict.hu
      ROOT_URL: "https://git.open-ict.hu/"
      # Also the HTTP Service's targetPort; the chart doesn't default it there.
      HTTP_PORT: "3000"
      # Traefik terminates TLS, so Gitea should use HTTP internally
      PROTOCOL: http
      ENABLE_GZIP: true
      SSH_DOMAIN: git.open-ict.hu
      SSH_PORT: "2222"
      SSH_LISTEN_PORT: "2222"
      START_SSH_SERVER: "true"
      LFS_START_SERVER: "true"

    database:
      SSL_MODE: disable

    service:
      # Explicit: Gitea 28 defaults to true. OIDC users self-register.
      DISABLE_REGISTRATION: "false"
      ALLOW_ONLY_EXTERNAL_REGISTRATION: "true"

    actions:
      ENABLED: "true"
      # Completed runs (with jobs and tasks) are deleted after this many days
      # by cron.cleanup_action_runs; 0 keeps them forever. 400 is Gitea's
      # default, set here so the retention is a visible choice.
      RUN_RETENTION_DAYS: "400"

    # Also enables Gitea's Terraform/OpenTofu state registry (backend "http").
    packages:
      ENABLED: "true"

    security:
      INSTALL_LOCK: "true"
      # Outbound HTTP from webhooks and OAuth2 avatar fetches. Strict allows
      # only the listed hosts; the default (lax) allows every public host and
      # applies the list to private ones only. In strict mode an entry without
      # a port covers only 80/443. auth.open-ict.hu is the Authentik IdP
      # (values-oidc.yaml): add the host of any other provider here.
      # Mirrors and migrations use [migrations], not this list. In-cluster
      # webhook targets also need an egress rule in networkpolicy.yaml, which
      # today allows only 443/587 outbound.
      # https://github.com/go-gitea/gitea/pull/39426
      EGRESS_MODE: strict
      ALLOWED_HOST_LIST: "*.svc.cluster.local:*,auth.open-ict.hu"
      # Take the client IP from X-Forwarded-For when the peer is a pod:
      # Traefik, then Anubis (2 hops; the Anubis bypass route is 1).
      # The pod CIDR is pinned in scripts/01 and 02. Every pod the
      # NetworkPolicy admits is trusted, runners included, so a workflow can
      # spoof its logged IP; Gitea uses the IP for logs, not authorization.
      REVERSE_PROXY_TRUSTED_PROXIES: "10.42.0.0/16"
      REVERSE_PROXY_LIMIT: "2"

    # Security events (logins, token, key, permission and settings changes),
    # shown in the admin/org/repo/user settings; pruned by
    # cron.delete_old_audit_events.
    audit:
      RECORD_OUTPUT: database
      RETENTION_DAYS: "90"

    # Default backend for LFS, packages, Actions artifacts/logs, attachments,
    # avatars and repo-archive (none sets its own STORAGE_TYPE). Repositories
    # stay on the PVC. Credentials: additionalConfigFromEnvs below.
    storage:
      STORAGE_TYPE: minio
      MINIO_ENDPOINT: garage.garage.svc.cluster.local:3900
      MINIO_BUCKET: gitea-storage
      MINIO_LOCATION: garage
      MINIO_USE_SSL: "false"
      # Must stay false: Garage is in-cluster only, so clients must not be
      # redirected to it.
      # https://docs.gitea.com/administration/config-cheat-sheet#storage-storage
      SERVE_DIRECT: "false"

  # GITEA__<SECTION>__<KEY> env vars from Secrets, so no credential is in git.
  # garage-gitea-storage-credentials is minted by the garage-bootstrap Job.
  additionalConfigFromEnvs:
    - name: GITEA__STORAGE__MINIO_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: garage-gitea-storage-credentials
          key: access-key-id
    - name: GITEA__STORAGE__MINIO_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: garage-gitea-storage-credentials
          key: secret-access-key
    # Required: the chart renders DATABASE.PASSWD from the plaintext
    # postgresql-ha.global.postgresql.password, never from existingSecret,
    # so without this app.ini has an empty password.
    # https://gitea.com/gitea/helm-chart/src/tag/v12.7.0/templates/_helpers.tpl
    - name: GITEA__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: postgresql-ha-credentials
          key: password
    # /metrics answers only with "Authorization: Bearer <token>". Secret
    # from scripts/01.
    - name: GITEA__METRICS__TOKEN
      valueFrom:
        secretKeyRef:
          name: gitea-metrics-token
          key: token
    # Normally generated once into app.ini; from a Secret so app.ini can be
    # rebuilt on every start (initPreScript below). Secret from scripts/01.
    - name: GITEA__SECURITY__SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: gitea-app-secrets
          key: secret-key
    - name: GITEA__SECURITY__INTERNAL_TOKEN
      valueFrom:
        secretKeyRef:
          name: gitea-app-secrets
          key: internal-token
    - name: GITEA__OAUTH2__JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: gitea-app-secrets
          key: jwt-secret
    - name: GITEA__SERVER__LFS_JWT_SECRET
      valueFrom:
        secretKeyRef:
          name: gitea-app-secrets
          key: lfs-jwt-secret

# Rebuild app.ini from values + Secrets on every start. The chart's init only
# adds and updates keys, so a key removed from gitea.config would otherwise
# stay in app.ini on the PVC forever. Safe because app.ini holds nothing else:
# the generated keys come from gitea-app-secrets above, and repos, SSH host
# keys and the OAuth2 signing key (/data/jwt) are separate files on the PVC.
# A pod without gitea-app-secrets never gets past init-app-ini, so Gitea can't
# start with freshly generated keys.
# Chart <= 12.7.0 renders the inline config as stringData, so a whole section
# removed from gitea.config stays in the gitea-inline-config Secret; delete
# that Secret once and Argo CD recreates it (COMMANDS.md).
initPreScript: |
  rm -f /data/gitea/conf/app.ini
