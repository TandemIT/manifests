apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gitea-restrict-ingress
  namespace: gitea
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: source-control
spec:
  # Garage egress (3900) is added by networkpolicy-garage.yaml.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitea
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 2222
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea-runners
      ports:
        - protocol: TCP
          port: 3000
    # PENDING kedacore/keda#8087: KEDA polling Gitea for queued jobs
    # (apps/gitea-runner/scaledobject.yaml checklist item 6).
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: keda
    #   ports:
    #     - protocol: TCP
    #       port: 3000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: anubis
          podSelector:
            matchLabels:
              app.kubernetes.io/name: anubis
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Gitea talks to pgpool, never to the PostgreSQL pods directly.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: pgpool
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: valkey-cluster
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Webhooks, OAuth providers, mirroring.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # SMTP submission for notification mail.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 587
