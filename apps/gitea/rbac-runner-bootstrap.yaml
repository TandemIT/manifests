# Lets the runner token Jobs (gitea-runners, gitea-runners-infra) read gitea-admin. Lives
# here because the gitea-runner kustomization rewrites every namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-token-bootstrap-read
  namespace: gitea
  labels:
    app.kubernetes.io/name: runner-token-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitea-admin"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-token-bootstrap-read
  namespace: gitea
  labels:
    app.kubernetes.io/name: runner-token-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-token-bootstrap-read
subjects:
  - kind: ServiceAccount
    name: runner-token-bootstrap
    namespace: gitea-runners
  - kind: ServiceAccount
    name: runner-infra-token-bootstrap
    namespace: gitea-runners-infra
