# Daily backup of the Garage-backed gitea-storage bucket (LFS, packages,
# actions artifacts/logs, attachments, avatars, repo-archives, and the
# Terraform/OpenTofu state registry — everything gitea.config.storage in
# apps/gitea/values.yaml routes to Garage instead of the PVC). Complements
# cronjob-backup-gitea-data.yaml (PVC only) and cronjob-backup-postgresql.yaml
# (DB only) — together the three CronJobs now cover every category of Gitea
# state. See README's "Backups" section.
#
# garage-gitea-storage-credentials is scoped to the gitea-storage bucket
# only; garage-backups-credentials is scoped to platform-backups only —
# neither key can read one bucket and write the other. This mirrors the
# bucket to local emptyDir storage with the first key, tars it, then
# uploads the archive with the second key (the same garage-backups-credentials
# the other two backup CronJobs upload with).
#
# Caveat: the mirror step needs node ephemeral storage roughly equal to the
# live bucket size (the tar step then needs a second, similar amount
# alongside it before the mirror is cleaned up). This is fine while the
# bucket is small; re-evaluate (e.g. tar-while-streaming, or a
# rclone/restic-based approach with real dedup) if it grows large enough for
# that to matter.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-garage-storage
  namespace: gitea
  labels:
    app.kubernetes.io/name: backup-garage-storage
    app.kubernetes.io/part-of: source-control
spec:
  schedule: "0 0 * * *" # 00:00 local — before backup-gitea-data (01:00) and backup-postgresql (01:30)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-garage-storage
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: mirror
              image: amazon/aws-cli:2.17.62
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: garage-gitea-storage-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: garage-gitea-storage-credentials
                      key: secret-access-key
                - name: AWS_ENDPOINT_URL_S3
                  value: "http://garage.garage.svc.cluster.local:3900"
                - name: AWS_REGION
                  value: "garage"
              command:
                - /bin/bash
                - -ec
                - |
                  aws s3 sync s3://gitea-storage /mirror --only-show-errors
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: mirror
                  mountPath: /mirror
            - name: tar
              image: alpine:3.20
              command:
                - /bin/sh
                - -ec
                - |
                  tar -czf "/backup/gitea-storage-$(date +%Y%m%dT%H%M%SZ).tar.gz" -C /mirror .
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: mirror
                  mountPath: /mirror
                  readOnly: true
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.62
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: garage-backups-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: garage-backups-credentials
                      key: secret-access-key
                - name: AWS_ENDPOINT_URL_S3
                  value: "http://garage.garage.svc.cluster.local:3900"
                - name: AWS_REGION
                  value: "garage"
              command:
                - /bin/bash
                - -ec
                - |
                  for f in /backup/*.tar.gz; do
                    aws s3 cp "${f}" "s3://platform-backups/gitea-storage/$(basename "${f}")"
                  done
                  cutoff=$(date -d '-14 days' +%Y%m%dT%H%M%SZ)
                  aws s3 ls s3://platform-backups/gitea-storage/ | awk '{print $4}' | while read -r key; do
                    stamp=$(echo "${key}" | sed -E 's/gitea-storage-([0-9TZ]+)\.tar\.gz/\1/')
                    [ -n "${stamp}" ] && [ "${stamp}" \< "${cutoff}" ] && aws s3 rm "s3://platform-backups/gitea-storage/${key}"
                  done
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
          volumes:
            - name: mirror
              emptyDir: {}
            - name: backup
              emptyDir: {}
