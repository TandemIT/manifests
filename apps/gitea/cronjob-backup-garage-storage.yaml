# The three backup CronJobs (this one, -gitea-data for the PVC, -postgresql
# for the database) run before kured's 02:00 window and upload to Garage's
# platform-backups bucket with 14-day retention.
#
# Retention uses if/then, not an && chain: under bash -e a kept object would
# end the loop with status 1 and fail the Job after a successful upload.
#
# Each Garage key is scoped to one bucket, so this mirrors gitea-storage with
# its own key and uploads the archive with garage-backups-credentials.
# Needs about twice the bucket size in node ephemeral storage (mirror + tar).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-garage-storage
  namespace: gitea
  labels:
    app.kubernetes.io/name: backup-garage-storage
    app.kubernetes.io/part-of: source-control
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-garage-storage
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: mirror
              image: amazon/aws-cli:2.17.62
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: garage-gitea-storage-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: garage-gitea-storage-credentials
                      key: secret-access-key
                - name: AWS_ENDPOINT_URL_S3
                  value: "http://garage.garage.svc.cluster.local:3900"
                - name: AWS_REGION
                  value: "garage"
              command:
                - /bin/bash
                - -ec
                - |
                  aws s3 sync s3://gitea-storage /mirror --only-show-errors
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: mirror
                  mountPath: /mirror
            - name: tar
              image: alpine:3.20
              command:
                - /bin/sh
                - -ec
                - |
                  tar -czf "/backup/gitea-storage-$(date +%Y%m%dT%H%M%SZ).tar.gz" -C /mirror .
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: mirror
                  mountPath: /mirror
                  readOnly: true
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.62
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: garage-backups-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: garage-backups-credentials
                      key: secret-access-key
                - name: AWS_ENDPOINT_URL_S3
                  value: "http://garage.garage.svc.cluster.local:3900"
                - name: AWS_REGION
                  value: "garage"
              command:
                - /bin/bash
                - -ec
                - |
                  for f in /backup/*.tar.gz; do
                    aws s3 cp "${f}" "s3://platform-backups/gitea-storage/$(basename "${f}")"
                  done
                  cutoff=$(date -d '-14 days' +%Y%m%dT%H%M%SZ)
                  aws s3 ls s3://platform-backups/gitea-storage/ | awk '{print $4}' | while read -r key; do
                    stamp=$(echo "${key}" | sed -E 's/gitea-storage-([0-9TZ]+)\.tar\.gz/\1/')
                    if [ -n "${stamp}" ] && [ "${stamp}" \< "${cutoff}" ]; then
                      aws s3 rm "s3://platform-backups/gitea-storage/${key}"
                    fi
                  done
              securityContext:
                runAsNonRoot: true
                runAsUser: 1001
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                  readOnly: true
          volumes:
            - name: mirror
              emptyDir: {}
            - name: backup
              emptyDir: {}
