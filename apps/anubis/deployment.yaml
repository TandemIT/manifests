apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: anubis
  labels:
    app.kubernetes.io/name: anubis
    app.kubernetes.io/part-of: ingress-protection
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anubis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anubis
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: policy
          configMap:
            name: anubis-policy
      containers:
        - name: anubis
          # Pinned (was :latest — every other component in this repo is
          # exact-pinned). Anubis's own build workflow only ever moves
          # :latest on a non-pre-release tag push, never on main-branch
          # commits or a "-pre" tag, so :latest was never at risk of
          # resolving to a pre-release; the real risk was drift over time.
          # https://github.com/TecharoHQ/anubis/blob/main/.github/workflows/docker.yml
          # https://github.com/TecharoHQ/anubis/releases/tag/v1.27.0
          image: ghcr.io/techarohq/anubis:v1.27.0
          # Safe now that the tag is an exact, immutable version rather than
          # a moving one; matches this repo's pull-policy convention for its
          # other directly-authored Deployments (e.g. apps/gitea-runner).
          imagePullPolicy: IfNotPresent
          env:
            - name: BIND
              value: ":8080"
            - name: DIFFICULTY
              value: "4"
            - name: ED25519_PRIVATE_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: anubis-key
                  key: ED25519_PRIVATE_KEY_HEX
            - name: METRICS_BIND
              value: ":9090"
            - name: SERVE_ROBOTS_TXT
              value: "true"
            - name: TARGET
              value: "http://gitea-http.gitea.svc.cluster.local:3000"
            - name: OG_PASSTHROUGH
              value: "true"
            - name: OG_EXPIRY_TIME
              value: "24h"
            - name: POLICY_FNAME
              value: "/etc/anubis/policy.yaml"
          volumeMounts:
            - name: policy
              mountPath: /etc/anubis
              readOnly: true
          resources:
            limits:
              cpu: 750m
              memory: 256Mi
            requests:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
