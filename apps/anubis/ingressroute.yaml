apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea-https
  namespace: anubis
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/name: anubis
    app.kubernetes.io/part-of: ingress-protection
spec:
  entryPoints:
    - websecure
  routes:
    # Trusted automation sources (off-cluster runners, internal tooling) skip
    # Anubis entirely and hit Gitea directly. Keep in sync with the http
    # route below.
    - kind: Rule
      match: Host(`git.open-ict.hu`) && ClientIP(`145.89.192.0/24`, `172.16.0.0/12`)
      priority: 100
      services:
        - name: gitea-http
          namespace: gitea
          port: 3000
    - kind: Rule
      match: Host(`git.open-ict.hu`)
      priority: 1
      middlewares:
        - name: gitea-rate-limit
          namespace: gitea
      services:
        - name: anubis
          port: 8080
  tls:
    secretName: gitea-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea-http
  namespace: anubis
  annotations:
    kubernetes.io/ingress.class: traefik
  labels:
    app.kubernetes.io/name: anubis
    app.kubernetes.io/part-of: ingress-protection
spec:
  entryPoints:
    - web
  routes:
    # Same bypass as the websecure route above; keep the CIDR list in sync.
    - kind: Rule
      match: Host(`git.open-ict.hu`) && ClientIP(`145.89.192.0/24`, `172.16.0.0/12`)
      priority: 100
      services:
        - name: gitea-http
          namespace: gitea
          port: 3000
    - kind: Rule
      match: Host(`git.open-ict.hu`)
      priority: 1
      middlewares:
        - name: https-redirect
      services:
        - name: anubis
          port: 8080
