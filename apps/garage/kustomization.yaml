apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Sets the namespace on bootstrap-rbac.yaml and job-bootstrap.yaml, which omit it.
namespace: garage

resources:
  - namespace.yaml
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
  - bootstrap-rbac.yaml
  - job-bootstrap.yaml
