# Read access to gitea/gitea-admin is in apps/gitea/rbac-runner-bootstrap.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-token-bootstrap
  labels:
    app.kubernetes.io/name: runner-token-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-token-bootstrap
  labels:
    app.kubernetes.io/name: runner-token-bootstrap
rules:
  # create cannot be restricted by resourceName
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  # PENDING kedacore/keda#8087: add "gitea-api-token" here
  # (scaledobject.yaml checklist item 5).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitea-runner-registration"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-token-bootstrap
  labels:
    app.kubernetes.io/name: runner-token-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-token-bootstrap
subjects:
  - kind: ServiceAccount
    name: runner-token-bootstrap
    namespace: gitea-runners
