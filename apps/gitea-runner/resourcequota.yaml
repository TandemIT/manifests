# Keeps runners from starving platform pods on the shared, untainted nodes.
# Sized against terraform.tfvars.example's node defaults (9 CPU / 18Gi in
# total). 5 replicas use 7.5 CPU / 7.5Gi of limits, so a 6th pod doesn't fit:
# rollouts use maxSurge 0 (deployment.yaml), and each replacement pod waits
# until the old one has drained.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gitea-runner-burst-guard
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/part-of: ci-runners
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 10Gi
    count/pods: "24"
