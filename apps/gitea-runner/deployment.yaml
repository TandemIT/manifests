apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  labels:
    app.kubernetes.io/name: gitea-runner
    app.kubernetes.io/part-of: ci-runners
  annotations:
    # After the token Job (wave 0), so runners never register with a placeholder.
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Fixed until a KEDA Gitea scaler ships: see scaledobject.yaml.
  replicas: 5
  selector:
    matchLabels:
      app: gitea-runner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9101"
      labels:
        app: gitea-runner
        app.kubernetes.io/name: gitea-runner
        app.kubernetes.io/part-of: ci-runners
    spec:
      serviceAccountName: gitea-runner
      automountServiceAccountToken: false
      # Above shutdown_timeout (3600s, configmap.yaml) so a draining job isn't killed.
      terminationGracePeriodSeconds: 3660
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: register
          # gitea/act_runner is deprecated in favour of gitea/runner; the
          # binary is now gitea-runner. https://gitea.com/gitea/runner
          image: gitea/runner:3.5.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-registration
                  key: token

            - name: GITEA_RUNNER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - sh
            - -ec
            - |
              gitea-runner -c /config/config.yaml register --ephemeral --no-interactive \
                --instance "${GITEA_INSTANCE_URL}" \
                --token "${GITEA_RUNNER_REGISTRATION_TOKEN}" \
                --name "${GITEA_RUNNER_NAME}"
          # Required: the namespace ResourceQuota rejects any container
          # without cpu/memory requests and limits.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /.cache
      containers:
        - name: runner
          image: gitea/runner:3.5.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: GITEA_INSTANCE_URL
              value: http://gitea-http.gitea.svc.cluster.local:3000
          command:
            - sh
            - -ec
            - |
              until wget -qO- http://127.0.0.1:2375/_ping 2>/dev/null; do sleep 1; done
              exec gitea-runner -c /config/config.yaml daemon
          ports:
            - name: metrics
              containerPort: 9101
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /.cache
        - name: dind
          image: docker:27-dind
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false
            # The pod's RuntimeDefault blocks mount/unshare, which dockerd
            # needs even when privileged.
            seccompProfile:
              type: Unconfined
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          args:
            # No --host: the entrypoint already binds tcp://0.0.0.0:2375, and its
            # case-sensitive check would add a second, conflicting bind. The
            # runner reaches it on 127.0.0.1.
            - --storage-driver=vfs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
      volumes:
        - name: config
          configMap:
            name: gitea-runner-config
        - name: data
          emptyDir: {}
        - name: docker-data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
