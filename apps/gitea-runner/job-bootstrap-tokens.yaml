# Mints the runner registration token against the live Gitea API.
#
# Syncs at wave 0 (with the namespace and RBAC); the runner Deployment is
# wave 1, so it only starts once a real token exists. The Job is idempotent:
# it no-ops once the secret already holds a non-placeholder value. To force
# a re-mint (e.g. after revoking the token in Gitea):
#   kubectl delete secret gitea-runner-registration -n gitea-runners
#   kubectl delete job runner-token-bootstrap -n gitea-runners
# and let Argo CD re-sync.
#
# NOTE (one-time cleanup on a cluster deployed before this change): this Job
# used to also mint gitea-api-token for a KEDA ScaledObject whose
# github-runner trigger didn't actually work against Gitea's instance-wide
# runner scope (see deployment.yaml). That ScaledObject/TriggerAuthentication
# pair is now commented-out placeholders in this directory, prepared for
# kedacore/keda#8087 instead — see scaledobject.yaml for the re-enablement
# checklist, which includes restoring this minting block. Until then, if
# that secret and the "keda-scaler" Gitea personal access token it wraps
# still exist on a live cluster, delete them by hand — they're unused now:
#   kubectl delete secret gitea-api-token -n gitea-runners
#   curl -X DELETE -u "<admin-user>:<admin-pass>" \
#     http://gitea-http.gitea.svc.cluster.local:3000/api/v1/users/<admin-user>/tokens/keda-scaler
apiVersion: batch/v1
kind: Job
metadata:
  name: runner-token-bootstrap
  labels:
    app.kubernetes.io/name: runner-token-bootstrap
  annotations:
    # Jobs are immutable: once created, the API server injects an auto-generated
    # spec.selector and batch.kubernetes.io/{controller-uid,job-name} pod labels.
    # A plain `kubectl replace` (Replace=true) sends the bare manifest without
    # them and is rejected ("spec.selector: Required value") on every sync after
    # the first, wedging the Application. Force=true makes Argo CD delete and
    # recreate instead; the idempotency guard in the script below keeps re-runs
    # safe (they no-op once both secrets hold non-placeholder values).
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 20
  # Generous ceiling: on a fresh cluster this Job waits for Gitea to come up.
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-token-bootstrap
    spec:
      serviceAccountName: runner-token-bootstrap
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: alpine/k8s:1.32.3
          command:
            - /bin/bash
            - -ec
            - |
              GITEA=http://gitea-http.gitea.svc.cluster.local:3000
              echo "Waiting for the Gitea API..."
              until curl -sf "${GITEA}/api/healthz" >/dev/null; do sleep 5; done

              ADMIN_USER=$(kubectl get secret gitea-admin -n gitea -o jsonpath='{.data.username}' | base64 -d)
              ADMIN_PASS=$(kubectl get secret gitea-admin -n gitea -o jsonpath='{.data.password}' | base64 -d)

              current=$(kubectl get secret gitea-runner-registration -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)
              case "${current}" in
                ""|placeholder*)
                  token=$(curl -sf -X POST -u "${ADMIN_USER}:${ADMIN_PASS}" \
                    "${GITEA}/api/v1/admin/actions/runners/registration-token" | jq -r .token)
                  [ -n "${token}" ] && [ "${token}" != "null" ]
                  kubectl create secret generic gitea-runner-registration \
                    --from-literal=token="${token}" \
                    --dry-run=client -o yaml | kubectl apply -f -
                  echo "Minted: gitea-runner-registration"
                  ;;
                *) echo "Exists: gitea-runner-registration" ;;
              esac

              # Disabled along with the KEDA ScaledObject, not deleted — see
              # apps/gitea-runner/scaledobject.yaml, checklist item 5.
              # Uncomment (strip the leading "# ") to restore gitea-api-token
              # minting when re-enabling KEDA autoscaling.
              # current=$(kubectl get secret gitea-api-token -o jsonpath='{.data.token}' 2>/dev/null | base64 -d || true)
              # case "${current}" in
              #   ""|placeholder*)
              #     # Drop a stale token of the same name so re-mints don't 409.
              #     curl -sf -X DELETE -u "${ADMIN_USER}:${ADMIN_PASS}" \
              #       "${GITEA}/api/v1/users/${ADMIN_USER}/tokens/keda-scaler" || true
              #     token=$(curl -sf -X POST -u "${ADMIN_USER}:${ADMIN_PASS}" \
              #       -H 'Content-Type: application/json' \
              #       -d '{"name":"keda-scaler","scopes":["read:admin"]}' \
              #       "${GITEA}/api/v1/users/${ADMIN_USER}/tokens" | jq -r .sha1)
              #     [ -n "${token}" ] && [ "${token}" != "null" ]
              #     kubectl create secret generic gitea-api-token \
              #       --from-literal=token="${token}" \
              #       --dry-run=client -o yaml | kubectl apply -f -
              #     echo "Minted: gitea-api-token"
              #     ;;
              #   *) echo "Exists: gitea-api-token" ;;
              # esac
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              # Verified live (Docker Desktop test cluster, 2026-09-22): this
              # namespace's ResourceQuota (resourcequota.yaml) tracks
              # limits.cpu, and Kubernetes rejects any pod that doesn't
              # declare one once a namespace quota tracks that resource —
              # without this the Job's pod is refused at admission
              # ("forbidden: failed quota ... must specify limits.cpu") on
              # every single sync, so the runner registration/KEDA tokens
              # never actually mint.
              cpu: 100m
              memory: 128Mi
