# PENDING: KEDA Gitea runner scaler release (kedacore/keda#8087, "General: Introduce new Gitea Runner Scaler")
# Status: prepared but unconfirmed; not in any KEDA release as of v2.21.0 (checked 2026-09-26, PR still open and unreviewed). Enable by uncommenting after the checklist below.
# Tracking: https://github.com/kedacore/keda/pull/8087
#
# Everything below is commented out and this file is not listed in
# kustomization.yaml, so it has no effect on the cluster. The runners run as
# a fixed `replicas: 5` Deployment (deployment.yaml) until this lands.
#
# Upstream state (PR opened 2026-08-24):
#   - unmerged, targeting `main`, one commit, no human maintainer review —
#     only an automated Copilot review flagging pagination, label-matching
#     and scope-validation concerns
#   - not in any released KEDA version; this cluster runs KEDA v2.15.1
#     (apps/keda/kustomization.yaml)
#   - silent on scale-to-zero / runner-deregistration reconciliation, which
#     is the actual hard problem with autoscaling Gitea runners
#   - the sibling `forgejo-runner` scaler took ~8 months of maintainer review
#     to merge (kedacore/keda#6495) and does not work against Gitea; a
#     separate Gitea-adjacent PR (#6765) sat 15 months and was closed stale
#
# Why not `github-runner`: this platform previously ran a ScaledObject with
# KEDA's `github-runner` trigger pointed at Gitea's GitHub-compatible API.
# `runnerScope: global` is not a value that trigger accepts (its source only
# allows org/ent/repo), so it returned a hard error on every poll — invisible
# because the fallback replica count equaled the floor. Gitea's instance-wide
# runner token has no org/ent/repo equivalent, so that trigger is not
# revivable; see README's "Runner Autoscaling" section.
#
# The field names below are a best-effort reconstruction of PR #8087's
# pre-review implementation — NOT a stable API; treat every field as
# unconfirmed. As of 2026-09-26 the PR names its URL field `apiURL` (not
# `giteaApiURL` as below) and also defines `scope`, `labels`, `targetJobs`
# and a `personalAccessToken` auth parameter.
#
# Before uncommenting, ALL of these must be true/done:
#   1. kedacore/keda#8087 (or a successor) has merged.
#   2. It has shipped in a released KEDA version.
#   3. apps/keda/kustomization.yaml has been bumped to that version.
#   4. The field names below match the *released*
#      https://keda.sh/docs/<version>/scalers/gitea-runner/ page.
#   5. The commented-out gitea-api-token minting block in
#      job-bootstrap-tokens.yaml is uncommented, with token scopes matching
#      the `scope:` used below, and "gitea-api-token" is added back to the
#      resourceNames in bootstrap-rbac.yaml.
#   6. The commented-out ingress rule allowing the `keda` namespace to reach
#      Gitea on port 3000 in apps/gitea/networkpolicy.yaml is uncommented.
#      (It only matters if the scaler calls the in-cluster Service; with the
#      public URL below, KEDA's traffic goes via the MetalLB VIP/Traefik.)
#   7. scaledobject.yaml and triggerauthentication.yaml are added to
#      apps/gitea-runner/kustomization.yaml's resources list.
#   8. deployment.yaml's fixed `replicas: 5` is revisited — once this is
#      live, KEDA owns the replica count.
#
# Not a blocker: Gitea's `/api/v1/admin/actions/jobs` endpoint (and the
# org/repo/user equivalents) is documented from Gitea 1.26.4 (absent in
# 1.24) and exists in the pinned Gitea 1.27.3.
#
# apiVersion: keda.sh/v1alpha1
# kind: ScaledObject
# metadata:
#   name: gitea-runner
#   labels:
#     app.kubernetes.io/name: gitea-runner
#     app.kubernetes.io/part-of: ci-runners
#   annotations:
#     # Wave 1: sync only after the runner-token-bootstrap Job (wave 0) has
#     # minted the KEDA API token (item 5 above).
#     argocd.argoproj.io/sync-wave: "1"
# spec:
#   scaleTargetRef:
#     name: gitea-runner
#   minReplicaCount: 5
#   maxReplicaCount: 10
#   pollingInterval: 15
#   cooldownPeriod: 120
#   # Hold at 5 replicas if the Gitea API is unreachable for 3 consecutive polls.
#   fallback:
#     failureThreshold: 3
#     replicas: 5
#   triggers:
#     - type: gitea-runner  # UNCONFIRMED trigger name — verify against released docs
#       metadata:
#         # UNCONFIRMED field name — PR #8087 builds every request from a
#         # configurable base URL rather than hardcoding Gitea's SaaS host.
#         giteaApiURL: https://git.open-ict.hu
#         # UNCONFIRMED field name/value. PR #8087 describes scope priority
#         # repo > org > global/admin > user; this instance has no single
#         # org or repo to scope to (an instance-wide runner), so this
#         # should map to whatever the merged PR calls its admin/global
#         # scope — confirm the exact value before uncommenting.
#         scope: admin
#         labels: ubuntu-latest,ubuntu-24.04,ubuntu-22.04
#         # UNCONFIRMED field name — desired jobs-per-replica threshold;
#         # PR #8087's default is 1.
#         targetJobs: "1"
#       authenticationRef:
#         name: gitea-keda-auth
