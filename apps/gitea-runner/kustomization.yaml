apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitea-runners

# Metadata labels only: commonLabels would also rewrite selectors, and a
# Deployment's selector is immutable.
labels:
  - pairs:
      app.kubernetes.io/part-of: ci-runners
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - bootstrap-rbac.yaml
  - job-bootstrap-tokens.yaml
  - configmap.yaml
  - service.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - networkpolicy-metrics.yaml
  - resourcequota.yaml
