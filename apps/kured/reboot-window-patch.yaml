# Replaces upstream's whole command list, so it repeats the upstream
# --reboot-sentinel (/sentinel is the host's /var/run).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kured
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: kured
          command:
            - /usr/bin/kured
            - --reboot-sentinel=/sentinel/reboot-required
            - --reboot-days=mon,tue,wed,thu,fri
            - --start-time=02:00
            - --end-time=05:00
            - --time-zone=Local
            - --period=1h
