apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Org-scoped runner for Cloud-Infra's deploy workflow (.gitea/workflows/).
# Separate from apps/gitea-runner: only Cloud-Infra's repos can schedule onto
# it, and its egress is limited at the site firewall, not by NetworkPolicy.
namespace: gitea-runners-infra

labels:
  - pairs:
      app.kubernetes.io/part-of: ci-runners
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - bootstrap-rbac.yaml
  - job-bootstrap-token.yaml
  - configmap.yaml
  - deployment.yaml
  - networkpolicy.yaml
  - resourcequota.yaml
