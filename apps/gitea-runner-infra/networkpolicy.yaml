# Ingress only: nothing connects to the runner (the kubelet probes still
# work). Egress is deliberately not limited here but at the site firewall.
# The firewall sees the node's IP (pod traffic is SNATed), not this pod, and
# never sees traffic that stays in the cluster or on 172.16.10.0/24 (Gitea,
# DNS, the K3s API via the VIP, node SSH). The shared runners keep their own
# egress limits (apps/gitea-runner/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runner-infra-guardrails
  labels:
    app.kubernetes.io/name: gitea-runner-infra
spec:
  podSelector:
    matchLabels:
      app: gitea-runner-infra
  policyTypes:
    - Ingress
