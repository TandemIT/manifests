apiVersion: v1
kind: ServiceAccount
metadata:
  name: runner-infra-token-bootstrap
  labels:
    app.kubernetes.io/name: runner-infra-token-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runner-infra-token-bootstrap
  labels:
    app.kubernetes.io/name: runner-infra-token-bootstrap
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["gitea-runner-infra-registration"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runner-infra-token-bootstrap
  labels:
    app.kubernetes.io/name: runner-infra-token-bootstrap
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runner-infra-token-bootstrap
subjects:
  - kind: ServiceAccount
    name: runner-infra-token-bootstrap
    namespace: gitea-runners-infra
