# Values for the official traefik/traefik chart (version pinned in
# argocd/apps/traefik.yaml and scripts/04-deploy-apps.sh).
# The entrypoint names web/websecure/ssh must not change — every IngressRoute
# references them.

image:
  # Pin the app version independently of the chart default.
  tag: v3.3.4

deployment:
  replicas: 2
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    # The chart exposes metrics on the dedicated "metrics" entrypoint.
    prometheus.io/port: "9100"

# Chart default is disabled. With 2 replicas + hard anti-affinity below,
# maxUnavailable: 1 keeps one Traefik pod serving ingress through any single
# node drain (Kured, and once introduced, system-upgrade-controller).
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ template "traefik.name" . }}'
            app.kubernetes.io/instance: '{{ template "traefik.fullname" . }}-{{ .Release.Namespace }}'
        topologyKey: kubernetes.io/hostname

ingressClass:
  enabled: true
  # Keep explicit class selection; do not capture all Ingresses by default.
  isDefaultClass: false

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik
  kubernetesIngress:
    enabled: true
    ingressClass: traefik

ports:
  # Container ports stay high so Traefik runs as non-root; exposedPort is
  # what the LoadBalancer Service publishes.
  web:
    port: 8000
    exposedPort: 80
  websecure:
    port: 8443
    exposedPort: 443
    tls:
      enabled: true
  # Gitea SSH passthrough (IngressRouteTCP in apps/gitea/ targets this
  # entrypoint by name).
  ssh:
    port: 2222
    exposedPort: 2222
    protocol: TCP
    expose:
      default: true

service:
  spec:
    allocateLoadBalancerNodePorts: false
    # MetalLB runs in L2 mode (platform/metallb): with the Kubernetes
    # default "Cluster" traffic policy, kube-proxy may hop traffic to a pod
    # on a different node and SNATs it in the process, replacing the real
    # client address with a node IP. "Local" keeps the packet on the node
    # that received it so Traefik sees the true source IP — required for
    # ClientIP()-based routing (apps/anubis) and IP-allowlist middlewares
    # (argocd/install) to see anything other than a node address.
    externalTrafficPolicy: Local

logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
