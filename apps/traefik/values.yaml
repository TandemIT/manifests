# The entrypoint names web/websecure/ssh must not change: every IngressRoute
# references them.

image:
  tag: v3.3.4

deployment:
  replicas: 2
  # No prometheus.io/* podAnnotations: the chart already sets scrape/path/port
  # (port 9100, its "metrics" entrypoint) while metrics.prometheus is enabled
  # (the default). Setting them here too renders duplicate keys.

# Chart default is disabled. With 2 replicas + hard anti-affinity below,
# maxUnavailable: 1 keeps one Traefik pod serving ingress through any single
# node drain (Kured, system-upgrade-controller).
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ template "traefik.name" . }}'
            app.kubernetes.io/instance: '{{ template "traefik.fullname" . }}-{{ .Release.Namespace }}'
        topologyKey: kubernetes.io/hostname

ingressClass:
  enabled: true
  # Keep explicit class selection; do not capture all Ingresses by default.
  isDefaultClass: false

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik
    # apps/anubis/ingressroute.yaml (namespace anubis) routes to the Gitea
    # service and rate-limit middleware in namespace gitea. Off by default;
    # without it Traefik drops both git.open-ict.hu routes (404).
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    ingressClass: traefik

ports:
  # Container ports stay high so Traefik runs as non-root; exposedPort is
  # what the LoadBalancer Service publishes.
  web:
    port: 8000
    exposedPort: 80
  websecure:
    port: 8443
    exposedPort: 443
    tls:
      enabled: true
  # Gitea SSH passthrough (IngressRouteTCP in apps/gitea/ targets this
  # entrypoint by name).
  ssh:
    port: 2222
    exposedPort: 2222
    protocol: TCP
    expose:
      default: true

service:
  spec:
    allocateLoadBalancerNodePorts: false
    # "Cluster" lets kube-proxy hop to another node and SNAT the client IP
    # away. "Local" preserves it, which ClientIP() routing (apps/anubis) and
    # the Argo CD allowlist depend on.
    externalTrafficPolicy: Local

logs:
  general:
    level: INFO
  access:
    enabled: true

metrics:
  prometheus:
    enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
