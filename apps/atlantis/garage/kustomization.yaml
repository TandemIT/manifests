apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Garage — the platform's shared S3-compatible storage — runs in the
# atlantis namespace (kept as-is; renaming would mean recreating the
# StatefulSet's PVCs). The namespace is created by
# apps/atlantis/namespace.yaml — apply atlantis/ first.
namespace: atlantis

resources:
  - configmap.yaml
  - statefulset.yaml
  - service.yaml
  - networkpolicy.yaml
  - bootstrap-rbac.yaml
  - job-bootstrap.yaml
