# No Terraform/OpenTofu workflow currently uses Garage (this repo's own
# cluster-provisioning terraform/ uses local state; Atlantis, the only past
# Garage-backed consumer, has been removed). If a future Gitea Actions
# workflow needs remote state, it should use Gitea's native Terraform State
# Registry (backend "http", not S3 — see README's "Terraform/OpenTofu state"
# section) rather than a new Garage bucket: Gitea 1.27.3 supports it
# natively, and its data already flows through Garage via the existing
# gitea-storage bucket/[storage] config, no separate bucket needed.
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: atlantis
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
---
# Headless service — gives each Garage pod a stable DNS name
# (garage-N.garage-headless.atlantis.svc.cluster.local) for inter-node RPC.
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: atlantis
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: gitops
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: 3901
