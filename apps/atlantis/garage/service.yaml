# No Terraform/OpenTofu workflow currently uses Garage as a state backend
# (Atlantis, the previous consumer, has been removed; this repo's own
# cluster-provisioning terraform/ uses local state). If a future Gitea
# Actions workflow needs one, it would use path-style S3 config against
# this Service (http://garage.atlantis.svc.cluster.local:3900), backed by a
# bucket + key minted the same way as apps/atlantis/garage/job-bootstrap.yaml
# already does for gitea-storage/platform-backups — not set up here since
# no such workflow exists yet.
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: atlantis
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: gitops
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
---
# Headless service — gives each Garage pod a stable DNS name
# (garage-N.garage-headless.atlantis.svc.cluster.local) for inter-node RPC.
apiVersion: v1
kind: Service
metadata:
  name: garage-headless
  namespace: atlantis
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/part-of: gitops
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: rpc
      port: 3901
      targetPort: 3901
