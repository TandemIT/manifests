apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# system-upgrade-controller - automated K3s binary upgrades. Upstream-first,
# same pattern as kured/KEDA/MetalLB: CRDs + controller from the pinned
# release, only the Plans (this cluster's upgrade policy) are local.
resources:
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.1/crd.yaml
  - https://github.com/rancher/system-upgrade-controller/releases/download/v0.20.1/system-upgrade-controller.yaml
  - plan-server.yaml
  - plan-agent.yaml
