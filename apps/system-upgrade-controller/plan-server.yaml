# One node at a time keeps etcd quorum. The channel tracks the installed
# minor (patch releases only); a minor bump is a deliberate edit here and in
# plan-agent.yaml. The window starts after kured's (02:00-05:00) ends.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
  labels:
    k3s-upgrade: server
spec:
  concurrency: 1
  cordon: true
  serviceAccountName: system-upgrade
  channel: https://update.k3s.io/v1-release/channels/v1.32
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  window:
    days: [mon, tue, wed, thu, fri]
    startTime: "05:30"
    endTime: "07:00"
    timeZone: Local
  drain:
    force: true
    ignoreDaemonSets: true
    deleteEmptydirData: true
    gracePeriod: 90
  upgrade:
    image: rancher/k3s-upgrade
