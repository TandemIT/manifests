apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied once by scripts/01, then managed by the "argocd" Application.
namespace: argocd

resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.4.4/manifests/install.yaml
  - certificate.yaml
  - ip-allowlist.yaml
  - middleware.yaml
  - ingressroute.yaml

patches:
  - path: argocd-cm-patch.yaml
  - path: argocd-cmd-params-cm-patch.yaml
