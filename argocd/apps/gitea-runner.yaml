# Wave 7, after gitea: the in-app token Job (wave 0) polls the Gitea API, and
# the runner Deployment (wave 1) starts only once a real token exists.
# Fixed replicas, no autoscaler: see apps/gitea-runner/scaledobject.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-runner
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TandemIT/manifests.git
    targetRevision: master
    path: apps/gitea-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
