# Garage — the platform's shared S3-compatible storage (Gitea object
# storage, platform backups). Formerly also ran Atlantis, which has been
# removed; this Application (name/path kept as "atlantis" to match the
# unrenamed namespace — see apps/atlantis/garage/kustomization.yaml) now
# deploys only the namespace and Garage. In-app wave ordering: Garage
# StatefulSet (wave 0) → garage-bootstrap Job (wave 1: cluster layout + S3
# credentials for Gitea object storage and backups).
#
# App-level wave is 5 (before gitea-config's namespace/RBAC-dependent "gitea"
# Application at wave 6): the garage-bootstrap Job writes
# garage-gitea-storage-credentials and garage-backups-credentials into the
# gitea namespace, which the Gitea Helm release's pod spec references via
# secretKeyRef — those Secrets must exist before Gitea's pod is created.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlantis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TandemIT/manifests.git
    targetRevision: master
    path: apps/atlantis
  destination:
    server: https://kubernetes.default.svc
    namespace: atlantis
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
