# Wave 7, after gitea: the token Job (wave 0) needs the Gitea API to create
# the Cloud-Infra org and mint its runner token.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea-runner-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/TandemIT/manifests.git
    targetRevision: master
    path: apps/gitea-runner-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea-runners-infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
