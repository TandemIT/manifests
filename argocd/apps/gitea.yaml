# Wave 6: the pod references Secrets from scripts/01, scripts/06 and the
# garage-bootstrap Job (wave 5); a missing one is CreateContainerConfigError.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://dl.gitea.com/charts/
      chart: gitea
      targetRevision: 12.7.0
      helm:
        releaseName: gitea
        valueFiles:
          - $values/apps/gitea/values.yaml
          # Generated by scripts/06-auth-providers.sh; empty lists are no-ops.
          - $values/apps/gitea/values-oidc.yaml
          - $values/apps/gitea/values-ldap.yaml
    - repoURL: https://github.com/TandemIT/manifests.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  # The valkey-cluster subchart omits apiVersion/kind in volumeClaimTemplates;
  # the API server adds them, so the StatefulSet never matches and selfHeal
  # re-applies it every minute.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
