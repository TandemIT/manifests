# Gitea Helm chart — multi-source app: the chart from the Gitea Helm repo,
# the values files from this repo. Requires the gitea-admin secret (created
# by scripts/01-bootstrap-first-master.sh), the postgresql-ha-credentials and
# postgresql-ha-pgpool-credentials secrets (created only by
# scripts/06-seal-secrets.sh, whose SealedSecrets the gitea-config app
# syncs at wave 4) — plus garage-gitea-storage-credentials, minted by the
# Garage app's (argocd/apps/garage.yaml) garage-bootstrap Job (wave 5).
# Wave 6 so the wave-4/5 sources have synced first; pods that reference a
# missing secret via secretKeyRef fail with CreateContainerConfigError.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://dl.gitea.com/charts/
      chart: gitea
      targetRevision: 12.7.0
      helm:
        releaseName: gitea
        valueFiles:
          - $values/apps/gitea/values.yaml
          # Generated by scripts/06-seal-secrets.sh from terraform.tfvars'
          # gitea_oidc_providers - an empty oauth list is a safe no-op.
          - $values/apps/gitea/values-oidc.yaml
          # Generated by scripts/06-seal-secrets.sh from terraform.tfvars'
          # gitea_ldap_providers - an empty ldap list is a safe no-op.
          - $values/apps/gitea/values-ldap.yaml
    - repoURL: https://github.com/TandemIT/manifests.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
