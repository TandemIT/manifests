# Chart from the traefik repo, values + namespace from this repo. The chart
# owns the traefik.io CRDs, so they upgrade with the release.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      # The app version is pinned separately (image.tag in values.yaml).
      targetRevision: 34.4.1
      helm:
        releaseName: traefik
        valueFiles:
          - $values/apps/traefik/values.yaml
    - repoURL: https://github.com/TandemIT/manifests.git
      targetRevision: master
      ref: values
      path: apps/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: -1
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
