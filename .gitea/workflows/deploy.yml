# # Runs deploy.sh (OpenTofu -> Ansible -> Argo CD) from the Cloud-Infra mirror
# # of this repo on every push to master: a pull-mirror sync fires the same
# # push event. Runs on the infra runner (apps/gitea-runner-infra/, label
# # "infra"), whose egress is controlled at the site firewall.
# #
# # Setup in the Cloud-Infra repo (Settings -> Actions):
# #   Secrets:   VM_PASSWORD       TF_VAR_vm_password
# #              STATE_PASSPHRASE  TF_VAR_state_passphrase (terraform/main.tf)
# #              STATE_TOKEN       token with write:package for the state backend
# #              PROXMOX_API_TOKEN_ID      TF_VAR_proxmox_api_token_id
# #              PROXMOX_API_TOKEN_SECRET  TF_VAR_proxmox_api_token_secret
# #              GITEA_OIDC_PROVIDERS      TF_VAR_gitea_oidc_providers (HCL map, {} = none)
# #              GITEA_LDAP_PROVIDERS      TF_VAR_gitea_ldap_providers (HCL map, {} = none)
# #              SSH_PRIVATE_KEY   key for ubuntu@ on every node (ssh_public_key)
# #   Variables: STATE_USER        owner of STATE_TOKEN
# # All other settings come from the committed terraform/cluster.auto.tfvars.
# # The provider maps must be complete: scripts/06 deletes the Secrets of any
# # OIDC/LDAP provider missing from them.
# #
# # deploy.sh refuses plans that destroy or replace a VM (ALLOW_VM_DESTROY);
# # those stay a manual, one-node-at-a-time job (CLAUDE.md). Every run writes a
# # new state version: ansible/inventory.yml is gitignored, so each fresh
# # checkout recreates local_file.ansible_inventory.
