apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied by scripts/01, not Argo CD: the addresses must exist before Argo CD
# syncs, and self-heal would fight L2/ARP tuning. system/kube-vip.yaml is a
# static-pod template the scripts copy to each control plane instead.
resources:
  - metallb/
  - coredns/coredns-custom.yaml
