apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# MetalLB instead of K3s ServiceLB (disabled in scripts/01..02): one stable
# LoadBalancer IP for DNS and HTTP-01, not one per node.
resources:
  - https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
  - ipaddresspool.yaml
  - l2advertisement.yaml
