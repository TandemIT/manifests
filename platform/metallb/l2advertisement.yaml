apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: l2-advertisement
  namespace: metallb-system
spec:
  # The public IP lives on the public VLAN, which the nodes reach only via
  # their address-less second NIC (terraform public_vlan_tag, named public0
  # by ansible/system-utils-install.yml). Announcing on eth0 (the internal
  # VLAN) would answer ARP where no router looks for this IP.
  interfaces:
    - public0
